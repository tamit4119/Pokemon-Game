<html>

<head>
    <meta content="charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Game with fetch</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div id="header">
        <h1>Pokemon Game</h1>
    </div>
    <div style="text-align: center;">
        <button id="fight">Fight</button>
    </div>
    <div id="container">
        <!-- player1 -->
        <div id="player1">
            <div class="card_header" id="card_header1">
                <span class="name" id="p1_name">Player 1</span>
                <span class="score" id="p1_score">Score: 0</span>
            </div>
            <div id="card1">
                <img src="" alt="Pokemon" id="img1">
                <span class="name" id="name1"></span>
                <span class="experience" id="experience1"></span>
                <ul class="abilities" id="abilities1">

                </ul>
            </div>
        </div>
        <div id="player2">
            <div class="card_header" id="card_header2">
                <span class="name" id="p2_name">Player 2</span>
                <span class="score" id="p2_score">Score: 0</span>
            </div>
            <!-- player2 -->
            <div id="card2">
                <img src="" alt="Pokemon" id="img2">
                <span class="name" id="name2"></span>
                <span class="experience" id="experience2"></span>
                <ul class="abilities" id="abilities2">

                </ul>
            </div>
        </div>
    </div>
</body>

</html>
